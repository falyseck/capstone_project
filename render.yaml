services:
  - type: web
    name: ppd-risk-api
    runtime: python
    plan: free
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn main:app --app-dir api --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////tmp/ppd.db
      - key: SECRET_KEY
        generateValue: true
